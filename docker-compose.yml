services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      QDRANT_URL: http://qdrant:6333
      DB_PATH: /data/rageval.db
    volumes: ["ragdata:/data"]
    depends_on: [qdrant]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
volumes:
  ragdata:
