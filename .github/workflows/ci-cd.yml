name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:                                   # CI: runs on every push and pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then
            if grep -qiE "torch|sentence-transformers" requirements.txt; then
              pip install torch --index-url https://download.pytorch.org/whl/cpu
            fi
            pip install -r requirements.txt
          fi
      - name: Run tests
        run: pytest -q || [ $? -eq 5 ]    # exit code 5 means "no tests found", which is not a failure

  build:                                  # CD step 1: build the Docker image and publish it to GitHub Container Registry
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:                                 # CD step 2: tell the host to deploy (skipped until the secret exists)
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger deploy
        if: env.DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK"
